name: platforms_build

on:
  push:
  pull_request:

env:
  VCPKG_GIT_REF: 2026.03.18
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            triplet: x64-linux
          - name: macOS 14
            os: macos-14
            triplet: arm64-osx
          - name: Windows 2022
            os: windows-2022
            triplet: x64-windows
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite

    steps:
      - name: Checkout Baysor
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_GIT_REF }}
          path: .vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ env.VCPKG_GIT_REF }}-

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAYSOR_WITH_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_INSTALLED_DIR="${RUNNER_TEMP}/vcpkg_installed"

      - name: Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 `
            -DBAYSOR_WITH_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" `
            -DVCPKG_INSTALLED_DIR="$env:RUNNER_TEMP/vcpkg_installed"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build/ci --target baysor --parallel

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/ci --config Release --target baysor --parallel

  ubuntu_tests:
    name: Ubuntu tests
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite

    steps:
      - name: Checkout Baysor
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_GIT_REF }}
          path: .vcpkg

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache
          key: ubuntu-tests-vcpkg-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ubuntu-tests-vcpkg-${{ env.VCPKG_GIT_REF }}-

      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure tests
        run: |
          cmake -S . -B build/tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAYSOR_WITH_TESTS=ON \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="${RUNNER_TEMP}/vcpkg_installed-tests"

      - name: Build tests
        run: cmake --build build/tests --target baysor baysor_tests --parallel

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure
